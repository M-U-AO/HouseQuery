[project]
name = "bj-presale-tracker"
version = "0.1.0"
description = "Local Beijing presale inventory tracker"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4",
  "fastapi",
  "httpx",
  "lxml",
  "socksio",
  "uvicorn",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
